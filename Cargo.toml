[workspace]
resolver = "3"
members = ["crates/fabomx-core", "crates/fabomx-wasm"]
# Tauri exige `ui/dist` à la compilation : les tests du moteur n'ont pas à en dépendre.
exclude = ["crates/fabomx-desktop"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Stéphane Muller"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
